<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place Your Order</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; font-weight: bold; }
    input, select, textarea, button { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
    button { margin-top: 1.5rem; background: #007bff; color: white; border: none; cursor: pointer; font-size: 1rem; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <h1>Order Form</h1>
  <form action="/submit-order" method="POST">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>

    <label for="product">Select Product</label>
    <select id="product" name="product">
      <option value="basic">Basic Package - $20</option>
      <option value="pro">Pro Package - $50</option>
      <option value="enterprise">Enterprise Package - $100</option>
    </select>

    <label for="quantity">Quantity</label>
    <input type="number" id="quantity" name="quantity" min="1" value="1" required>

    <label for="address">Shipping Address</label>
    <textarea id="address" name="address" rows="3" required></textarea>

    <button type="submit">Submit Order</button>
  </form>

</body>
</html>
